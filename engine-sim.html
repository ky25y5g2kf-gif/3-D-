<title>Engine Load Sim 3D Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#e0e0e0;font-family:system-ui,sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;user-select:none;touch-action:none}
header{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;background:#0c0c0c;border-bottom:1px solid #1a1a1a;z-index:20}
header h1{font-size:12px;font-weight:600;letter-spacing:1px}
.status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.status.ok{background:#0a2a0a;color:#4caf50}.status.warn{background:#2a1a00;color:#ff9800}
.status.danger{background:#2a0a0a;color:#f44336;animation:p .7s infinite}
@keyframes p{50%{opacity:.55}}
#view{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;top:6px;left:6px;right:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;pointer-events:none;z-index:5}
@media(min-width:700px){.hud{grid-template-columns:repeat(8,1fr)}}
.metric{background:rgba(0,0,0,.6);border:1px solid #2a2a2a;border-radius:8px;padding:4px 4px;min-width:0;text-align:center}
.metric .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.off{background:#1a1a1a;color:#999}
.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:rgba(20,20,20,.92);border:1px solid #444;color:#eee;padding:6px 12px;border-radius:12px;font-size:11px;font-weight:600;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media(min-width:700px){.toast{top:60px}}
.metric .val{font-size:14px;font-weight:700}.metric .lbl{font-size:8px;color:#777;text-transform:uppercase}
.metric.rpm .val{color:#4fc3f7}.metric.load .val{color:#ffb74d}.metric.temp .val{color:#ef5350}
.metric.power .val{color:#81c784}.metric.boost .val{color:#ff80ab}.metric.gearm .val{color:#ce93d8}
.metric.cool .val{color:#4dd0e1}
.warning{position:absolute;bottom:44px;white-space:nowrap;left:50%;transform:translateX(-50%);background:rgba(200,30,30,.9);color:#fff;padding:5px 14px;border-radius:16px;font-size:12px;font-weight:700;display:none;z-index:5}
.controls{background:#0c0c0c;border-top:1px solid #1a1a1a;padding:7px 8px 12px;z-index:20}
.row{display:flex;gap:5px;margin-bottom:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.gear,.shift,.tbtn,.pm{height:34px;border-radius:8px;border:2px solid #2a2a2a;background:#141414;color:#888;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px}
.gear{width:34px}.shift,.pm{width:34px;border-color:#444;color:#ddd}
.gear.active-p{border-color:#42a5f5;color:#42a5f5;background:#0b1a2a}
.gear.active-r{border-color:#ef5350;color:#ef5350;background:#2a0e0e}
.gear.active-n,.gear.active-d{border-color:#66bb6a;color:#66bb6a;background:#0e2a10}
.gear.active-m{border-color:#ffb74d;color:#ffb74d;background:#2a1c08}
.shift-btns{display:none;gap:4px}.shift-btns.show{display:flex}
.tbtn.active{border-color:#4fc3f7;color:#4fc3f7}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.slider-box{background:#141414;border-radius:8px;padding:5px 8px;border:1px solid #222}
.slider-box label{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#888;margin-bottom:3px}
.slider-box label span{color:#eee;font-weight:600}
.pm-row{display:flex;gap:4px;align-items:center}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:#2a2a2a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid #fff;cursor:pointer}
#gas::-webkit-slider-thumb{background:#ffb74d}#brake::-webkit-slider-thumb{background:#ef5350}
.btn-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.btn{height:32px;border-radius:7px;border:none;font-size:clamp(8.5px,2.5vw,10px);font-weight:600;cursor:pointer;padding:0 2px;white-space:nowrap;overflow:hidden}
.btn-start{background:#2a0e0e;color:#ef9a9a;border:1px solid #5a2020}
.btn-start.off{background:#1b5e20;color:#fff;border-color:#4caf50;animation:p 1s infinite}
.btn-start.crank{background:#33691e;color:#fff;border-color:#8bc34a;animation:none}
.btn-reset{background:#222;color:#bbb}
.btn-load{background:#1f1500;color:#ffb74d;border:1px solid #4a3500}
.btn-load.active{background:#ff9800;color:#111}
.btn-turbo{background:#1a0a2a;color:#ce93d8;border:1px solid #4a2a6a}
.btn-turbo.active{background:#9c27b0;color:#fff}
.btn-repair{background:#0f1f0f;color:#81c784;border:1px solid #1f3a1f}
.view-btns{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;z-index:5}
.view-btn,.sound-btn{background:rgba(0,0,0,.65);border:1px solid #333;color:#aaa;font-size:9px;padding:4px 8px;border-radius:6px;cursor:pointer}
.view-btn.active{border-color:#4fc3f7;color:#4fc3f7}
.sound-btn{position:absolute;bottom:8px;left:8px;z-index:5}
.sound-btn.on{border-color:#81c784;color:#81c784}
</style>

<body>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const eng={
  rpm:800,throttle:0,brake:0,gear:'P',manualGear:1,temp:88,power:0,wear:0,
  maxRpm:7200,idle:800,angle:0,transparent:true,turbo:false,stalled:false,boost:0,
  type:'petrol',variant:'i4',coolEff:90,coolFlow:0,omega:83.8,idleI:0,torque:0,load:0,
  turboOmega:0, thermoOpen:.2,
  fanOn:false,     // электровентилятор радиатора (гистерезис 97°/92°)
  offReason:'',    // почему не работает: 'off' — заглушил сам, 'overheat' / 'wear' / 'nostart'
  startT:0         // сек. на попытку запуска стартером
};
const AMBIENT=22;          // °C воздуха
const HEAT_CAP=40;         // теплоёмкость I4 (мотор + ОЖ), кДж/°C; V6 — пропорционально числу цилиндров
const START_MAX_TEMP=125,START_MAX_WEAR=90;
const gearRatio={P:0,R:-.35,N:0,D:1,M:1};
const manualRatios=[0,3.5,2.2,1.5,1.1,.85,.7];
let extraLoad=false;

// ===== PHYSICS core: crank-slider + cylinder pressure + flywheel + vehicle =====
const TAU=Math.PI*2,FOUR=Math.PI*4,D2R=Math.PI/180;
const RS=.27,LS=.9;                                   // scene units: crank radius, rod length
const P={r:.043,L:.143,bore:.086,mRec:.5,J:.2};P.A=Math.PI*P.bore*P.bore/4;   // SI units
const V={m:1500,R:.32,fin:3.9,v:0,g:1,t:0};           // vehicle: mass, wheel radius, final drive, speed, auto gear
let cyls=[],blks=[],hds=[];   // cyls[i]={x,b,fire,phi,piston,rod,top}; top = Group at head face (bank-local) for valves/plugs
//<PHYS
function makeQ(rpm,thr,boost,diesel,cut){
  const cr=diesel?17:10.5,rf=rpm/(diesel?4800:7200);
  const ve=.84+.14*Math.exp(-Math.pow((rpm-(diesel?2600:4300))/2600,2));
  const map=diesel?1:.12+.88*Math.pow(thr,.85);   // .12: иначе прогретый мотор не держит 800 на ХХ
  return{pin:(map+boost)*ve,Pi:cut?1:diesel?1+3.7*thr:4.5,vc:1/(cr-1),vb:cr/(cr-1),n:diesel?1.35:1.32,
    ign:diesel?-6*D2R:-(12+18*rf)*D2R,dur:diesel?75*D2R:(48+10*rf)*D2R,cut:cut,pex:1.05+.12*rf*(1+boost*.5)};
}
// torque (N*m) from one cylinder at crank angle th; fire = firing TDC angle in the 720deg cycle
function cylT(fire,th,w,Q){
  const c=((th-fire)%FOUR+FOUR)%FOUR,s=Math.sin(c),co=Math.cos(c),r=P.r,L=P.L;
  const q=Math.sqrt(L*L-r*r*s*s),v=Q.vc+(L+r-r*co-q)/(2*r);
  let p;
  if(c>=Math.PI&&c<3*Math.PI)p=c<TAU?Q.pex:Q.pin*.93;          // exhaust / intake
  else{                                                         // compression + combustion + expansion
    const cc=c>=3*Math.PI?c-FOUR:c;let x=0;
    if(!Q.cut&&cc>Q.ign){const u=Math.min(1,(cc-Q.ign)/Q.dur);x=1-Math.exp(-5*u*u*u);}   // Wiebe burn fraction
    p=Q.pin*Math.pow(Q.vb/v,Q.n)*(1+(Q.Pi-1)*x);
    if(c>.8*Math.PI&&c<Math.PI)p+=(Q.pex-p)*(c-.8*Math.PI)/(.2*Math.PI);   // blowdown after EVO
  }
  const k=r/L;
  return (p-1)*1e5*P.A*r*s*(1+r*co/q)-P.mRec*w*w*r*r*(s+k*.5*Math.sin(2*c))*(co+k*Math.cos(2*c));
}
//PHYS>

// Audio: exhaust-port pressure of every cylinder (blowdown + piston displacement, firing order from cyls[].fire)
// is rendered into one looped 720deg wavetable; pitch follows rpm (firing freq = rpm/60*cyl/2); load crossfades light/full-load tables.
let audioCtx,gainNode,noiseGain,exhF,soundOn=false,exh=null;
const EXH_REF=1500;
//<EXH
function exhaustCycle(rpm,thr,boost,dsl,N){
  const Q=makeQ(rpm,thr,boost,dsl,false),out=new Float32Array(N),r=P.r,L=P.L,EVO=.8*Math.PI,EVC=2.1*Math.PI;
  const q0=Math.sqrt(L*L-r*r*Math.pow(Math.sin(EVO),2)),v0=Q.vc+(L+r-r*Math.cos(EVO)-q0)/(2*r);
  const dp=Q.pin*Math.pow(Q.vb/v0,Q.n)*Q.Pi-Q.pex,tau=dsl?.5:.4;   // cylinder pressure above exhaust line at EVO
  for(let j=0;j<N;j++){
    const th=FOUR*j/N;let s=0;
    for(let i=0;i<cyls.length;i++){
      const c=((th-cyls[i].fire)%FOUR+FOUR)%FOUR;
      if(c<EVO||c>EVC)continue;
      const sn=Math.sin(c),cs=Math.cos(c),q=Math.sqrt(L*L-r*r*sn*sn);
      const win=Math.min(1,(c-EVO)/.06)*Math.min(1,(EVC-c)/.15);
      s+=win*(dp*Math.exp(-(c-EVO)/tau)+.55*Math.max(0,-sn)*(1+r*cs/q)*Q.pex);
    }
    out[j]=s;
  }
  let m=0;for(let j=0;j<N;j++)m+=out[j];m/=N;for(let j=0;j<N;j++)out[j]-=m;
  return out;
}
//EXH>
function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();gainNode.gain.value=0;gainNode.connect(audioCtx.destination);
  exhF=audioCtx.createBiquadFilter();exhF.type='lowpass';exhF.frequency.value=1600;exhF.Q.value=.8;   // muffler
  const sh=audioCtx.createBiquadFilter();sh.type='lowshelf';sh.frequency.value=180;sh.gain.value=5;
  exhF.connect(sh);sh.connect(gainNode);
  const buf=audioCtx.createBuffer(1,2*audioCtx.sampleRate,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=audioCtx.createBufferSource();n.buffer=buf;n.loop=true;
  noiseGain=audioCtx.createGain();noiseGain.gain.value=0;
  const nf=audioCtx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=350;
  n.connect(nf);nf.connect(noiseGain);noiseGain.connect(gainNode);n.start();
}
function buildExhaust(){      // call again whenever cyls[] layout changes (type/variant)
  if(exh)exh.src.forEach(s=>{try{s.stop();s.disconnect();}catch(e){}});
  const sr=audioCtx.sampleRate,N=Math.round(sr*120/EXH_REF),dsl=eng.type==='diesel',t0=audioCtx.currentTime+.05;
  const hi=exhaustCycle(3500,1,0,dsl,N),lo=exhaustCycle(3500,.12,0,dsl,N);
  let pk=1e-6;for(let j=0;j<N;j++)pk=Math.max(pk,Math.abs(hi[j]));
  const src=[lo,hi].map(d=>{
    const b=audioCtx.createBuffer(1,N,sr),ch=b.getChannelData(0);for(let j=0;j<N;j++)ch[j]=d[j]/pk;
    const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;s.loop=true;g.gain.value=0;
    s.connect(g);g.connect(exhF);s.start(t0);s.g=g;return s;
  });
  exh={sig:eng.type+eng.variant,src:src};
}
function updateSound(){
  if(!soundOn||!audioCtx||eng.stalled){if(gainNode)gainNode.gain.setTargetAtTime(0,audioCtx.currentTime,.1);return;}
  const t=audioCtx.currentTime,n=eng.rpm/eng.maxRpm;
  if(!exh||exh.sig!==eng.type+eng.variant)buildExhaust();
  const mix=Math.min(1,eng.throttle*1.1+eng.load/250);
  exh.src[0].g.gain.setTargetAtTime(1-mix,t,.05);exh.src[1].g.gain.setTargetAtTime(mix,t,.05);
  exh.src.forEach(s=>s.playbackRate.setTargetAtTime(Math.max(.05,eng.rpm/EXH_REF),t,.03));
  let vol=.22+.14*n+eng.boost*.05;
  if(eng.type==='diesel')vol*=1.1;
  gainNode.gain.setTargetAtTime(Math.min(.5,vol),t,.08);
  noiseGain.gain.setTargetAtTime(.01+n*.05*(.3+mix),t,.08);
}
document.getElementById('soundBtn').onclick=function(){
  initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
  soundOn=!soundOn;this.classList.toggle('on',soundOn);
  this.textContent=soundOn?'🔊 ЗВУК ВКЛ':'🔊 ЗВУК';
  if(!soundOn&&gainNode)gainNode.gain.setTargetAtTime(0,audioCtx.currentTime,.1);
};

// UI helpers
function setGas(v){v=Math.max(0,Math.min(100,v));gasEl.value=v;eng.throttle=v/100;document.getElementById('gasVal').textContent=v+'%';}
function setBrake(v){v=Math.max(0,Math.min(100,v));brakeEl.value=v;eng.brake=v/100;document.getElementById('brakeVal').textContent=v+'%';}

document.querySelectorAll('.gear').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('.gear').forEach(g=>g.className='gear');
    el.classList.add('active-'+el.dataset.gear.toLowerCase());
    eng.gear=el.dataset.gear;
    document.getElementById('shiftBtns').classList.toggle('show',eng.gear==='M');
    document.getElementById('gearVal').textContent=eng.gear==='M'?'M'+eng.manualGear:eng.gear;
  };
});
document.getElementById('gearUp').onclick=()=>{if(eng.manualGear<6){eng.manualGear++;document.getElementById('gearVal').textContent='M'+eng.manualGear;}};
document.getElementById('gearDown').onclick=()=>{if(eng.manualGear>1){eng.manualGear--;document.getElementById('gearVal').textContent='M'+eng.manualGear;}};

document.querySelectorAll('.tbtn').forEach(btn=>{
  btn.onclick=()=>{
    if(btn.dataset.type){document.querySelectorAll('[data-type]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');eng.type=btn.dataset.type;rebuild();}
    if(btn.dataset.var){document.querySelectorAll('[data-var]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');eng.variant=btn.dataset.var;rebuild();}
  };
});

const gasEl=document.getElementById('gas'),brakeEl=document.getElementById('brake');
gasEl.oninput=()=>setGas(+gasEl.value);
brakeEl.oninput=()=>setBrake(+brakeEl.value);
document.getElementById('gasPlus').onclick=()=>setGas(+gasEl.value+5);
document.getElementById('gasMinus').onclick=()=>setGas(+gasEl.value-5);
document.getElementById('brakePlus').onclick=()=>setBrake(+brakeEl.value+5);
document.getElementById('brakeMinus').onclick=()=>setBrake(+brakeEl.value-5);

let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
const inGear=()=>eng.gear!=='P'&&eng.gear!=='N';

document.getElementById('resetBtn').onclick=()=>{
  Object.assign(eng,{rpm:800,omega:83.8,angle:0,idleI:0,torque:0,load:0,temp:88,wear:0,throttle:0,brake:0,stalled:false,manualGear:1,turbo:false,boost:0,turboOmega:0,thermoOpen:.2,
    fanOn:false,offReason:'',startT:0});V.v=0;V.g=1;document.querySelector('.gear[data-gear=P]').click();
  setGas(0);setBrake(0);
  document.getElementById('loadBtn').classList.remove('active');document.getElementById('turboBtn').classList.remove('active');
  extraLoad=false;document.getElementById('gearVal').textContent=eng.gear;
};
document.getElementById('loadBtn').onclick=function(){
  extraLoad=!extraLoad;this.classList.toggle('active',extraLoad);
  if(extraLoad&&!inGear())toast('Нагрузка действует только на передаче (R / D / M)');
};
document.getElementById('turboBtn').onclick=function(){eng.turbo=!eng.turbo;this.classList.toggle('active',eng.turbo);};
// Ремонт: сильно снижает износ и температуру, но мотор НЕ заводит
document.getElementById('repairBtn').onclick=()=>{
  eng.wear=Math.max(0,eng.wear-60);
  if(eng.temp>90)eng.temp=Math.max(88,eng.temp-50);
  toast(eng.stalled?'Отремонтирован. Теперь — ЗАВЕСТИ':'Ремонт: износ −60%, температура −50°');
};
// Завести / заглушить. Запуск — настоящий: снимаем отсечку, дальше стартер (Ts в физике) крутит до схватывания

function clear(){
  const sh=new Set(Object.values(M));
  engineG.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&!sh.has(o.material))o.material.dispose();});
  while(engineG.children.length)engineG.remove(engineG.children[0]);
  pistons=[];rods=[];turbos=[];injectors=[];cyls=[];blks=[];hds=[];
}

function makeTurbo(x,y,z,rotY){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.3,14,11),M.turboBody));
  const comp=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.11,14),M.turboBody);
  comp.position.x=-.26;comp.rotation.z=Math.PI/2;g.add(comp);
  const turb=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,.11,14),M.turboBody);
  turb.position.x=.26;turb.rotation.z=Math.PI/2;g.add(turb);
  const bladeG=new THREE.Group();
  for(let i=0;i<8;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.018,.16,.05),M.blade);
    const a=i*Math.PI*2/8;
    b.position.set(-.26,Math.cos(a)*.08,Math.sin(a)*.08);b.rotation.x=a;bladeG.add(b);
  }
  for(let i=0;i<10;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.014,.14,.04),M.blade);
    const a=i*Math.PI*2/10;
    b.position.set(.26,Math.cos(a)*.07,Math.sin(a)*.07);b.rotation.x=a;bladeG.add(b);
  }
  g.add(bladeG);
  const inP=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,.32,8),M.pipe);
  inP.position.set(-.48,.04,0);inP.rotation.z=Math.PI/2;g.add(inP);
  const outP=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,.36,8),M.pipe);
  outP.position.set(.12,.3,0);outP.rotation.z=-.55;g.add(outP);
  g.position.set(x,y,z);g.rotation.y=rotY;g.userData.blades=bladeG;
  return g;
}

function rebuild(){
  clear();
  const isV=eng.variant==='v6',isD=eng.type==='diesel';
  const bw=isV?2.3:2.7,bd=isV?1.7:1.2;
  // [x, bank angle (deg), firing TDC in 720deg cycle (deg)] in cylinder-number order
  const lay=isV?[[-.65,30,0],[-.1,30,240],[.45,30,480],[-.45,-30,120],[.1,-30,360],[.65,-30,600]]   // 1-4-2-5-3-6
              :[[-.95,0,0],[-.32,0,540],[.32,0,180],[.95,0,360]];                                     // 1-3-4-2
  const mk=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o;};
  // Banks: group at crank axis, tilted about X. Everything inside is bank-local: +Y = cylinder axis, crank axis at y=0
  const bg={};
  (isV?[30,-30]:[0]).forEach(b=>{
    const g=new THREE.Group();g.position.y=-.55;g.rotation.x=b*D2R;engineG.add(g);bg[b]=g;
    const wd=isV?2.0:bw,dp=isV?.95:bd;
    const blk=mk(new THREE.BoxGeometry(wd,1.2,dp),isD?M.dieselT:M.blockT,0,.8,0);g.add(blk);blks.push(blk);
    const hd=mk(new THREE.BoxGeometry(wd+.12,.3,dp+.12),M.headT,0,1.5,0);g.add(hd);hds.push(hd);
  });
  blockMesh=blks[0];headMesh=hds[0];
  const liG=new THREE.CylinderGeometry(.21,.21,.95,18,1,true),
        liM=new THREE.MeshStandardMaterial({color:0x2a2a32,metalness:.4,roughness:.45,side:THREE.DoubleSide,transparent:true,opacity:.55}),
        pG=new THREE.CylinderGeometry(.19,.19,.28,16),cG=new THREE.CylinderGeometry(.19,.185,.04,16),
        cM=new THREE.MeshStandardMaterial({color:0xa0a0a8,metalness:.7,roughness:.3}),rnG=new THREE.TorusGeometry(.192,.008,5,20),
        rdG=new THREE.BoxGeometry(.05,LS-.2,.07),bgG=new THREE.CylinderGeometry(.075,.075,.1,12),smG=new THREE.CylinderGeometry(.035,.035,.06,8),
        ijG=new THREE.CylinderGeometry(.04,.03,.2,8),tpG=new THREE.ConeGeometry(.025,.08,8);
  lay.forEach(([x,b,f])=>{
    const g=bg[b],cy={x:x,b:b*D2R,fire:f*D2R,phi:(b-f)*D2R};   // phi: crank-pin phase (split pins on V6)
    g.add(mk(liG,liM,x,.9,0));
    const pist=new THREE.Group();pist.add(new THREE.Mesh(pG,M.piston));pist.add(mk(cG,cM,0,.16,0));
    for(let r=0;r<3;r++){const ring=mk(rnG,M.ring,0,.05-r*.06,0);ring.rotation.x=Math.PI/2;pist.add(ring);}
    pist.position.set(x,.9,0);g.add(pist);cy.piston=pist;pistons.push({m:pist,bank:b});
    // rod group origin = big end (crank pin); +Y points to the piston pin
    const rod=new THREE.Group();rod.add(mk(rdG,M.rod,0,LS/2,0));
    const big=mk(bgG,M.rod,0,0,0);big.rotation.z=Math.PI/2;rod.add(big);
    const sm=mk(smG,M.rod,0,LS,0);sm.rotation.z=Math.PI/2;rod.add(sm);
    rod.position.x=x;g.add(rod);cy.rod=rod;rods.push({m:rod,bank:b});
    const inj=new THREE.Group();inj.add(new THREE.Mesh(ijG,M.inj));inj.add(mk(tpG,M.inj,0,-.14,0));
    inj.position.set(x,1.67,0);g.add(inj);injectors.push(inj);
    cy.top=new THREE.Group();cy.top.position.set(x,1.37,0);g.add(cy.top);
    // Valves (2 intake + 2 exhaust) + spark/glow plug
    const vMat=M.valve, vsMat=M.valveStem;
    function makeValve(ox,oz){
      const vg=new THREE.Group();
      const head=new THREE.Mesh(new THREE.CylinderGeometry(.055,.06,.018,12),vMat);
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.22,8),vsMat);
      stem.position.y=.12; head.position.y=0; vg.add(head);vg.add(stem);
      vg.position.set(ox,0.02,oz); return vg;
    }
    cy.iv1=makeValve(-.07,.06); cy.iv2=makeValve(-.07,-.06);
    cy.ev1=makeValve(.07,.06);  cy.ev2=makeValve(.07,-.06);
    cy.top.add(cy.iv1,cy.iv2,cy.ev1,cy.ev2);
    // Spark plug (petrol) / glow plug (diesel) – same visual for now
    const sp=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.025,.028,.12,8),M.spark);
    const tip=new THREE.Mesh(new THREE.CylinderGeometry(.008,.012,.04,6),M.sparkTip);
    tip.position.y=-.08; body.position.y=.02; sp.add(body);sp.add(tip);
    sp.position.set(0,.08,0); cy.top.add(sp); cy.spark=sp;
    cyls.push(cy);
  });
  // Crankshaft: web + counterweight + pin rotated by phi about X; pin is at radius RS
  crankG=new THREE.Group();crankG.position.y=-.55;engineG.add(crankG);
  const main=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,isV?2.4:2.7,12),M.crank);main.rotation.z=Math.PI/2;crankG.add(main);
  cyls.forEach(cy=>{
    const wg=new THREE.Group();wg.rotation.x=cy.phi;wg.position.x=cy.x;crankG.add(wg);
    wg.add(mk(new THREE.BoxGeometry(.1,RS+.16,.22),M.crank,0,RS/2,0));
    wg.add(mk(new THREE.BoxGeometry(.1,.3,.3),M.crank,0,-.2,0));
    const pin=mk(new THREE.CylinderGeometry(.065,.065,.2,10),M.crank,0,RS,0);pin.rotation.z=Math.PI/2;wg.add(pin);
  });

  // Turbos
  engineG.add(makeTurbo(-1.75,.7,isV?.75:.75,0));
  engineG.add(makeTurbo(1.75,.7,isV?-.75:-.75,Math.PI));
  turbos=engineG.children.filter(c=>c.userData&&c.userData.blades);

  [-1,1].forEach(side=>{
    const ex=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,1.2,8),M.pipe);
    ex.position.set(side*.95,.95,side*(isV?.55:.6));ex.rotation.z=side*.45;ex.rotation.x=.25;engineG.add(ex);
  });

  // === COOLING SYSTEM ===
  // Radiator
  const rad=new THREE.Mesh(new THREE.BoxGeometry(.25,1.1,1.4),M.rad);
  rad.position.set(2.3,.5,0);engineG.add(rad);
  // Radiator core detail
  for(let i=0;i<6;i++){
    const fin=new THREE.Mesh(new THREE.BoxGeometry(.02,1.0,1.3),new THREE.MeshStandardMaterial({color:0x2a3a4a,metalness:.5,roughness:.4}));
    fin.position.set(2.3,-.05+i*.18,0);engineG.add(fin);
  }
  // Fan
  radFan=new THREE.Group();
  const fanHub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.06,10),M.pump);
  radFan.add(fanHub);
  for(let i=0;i<5;i++){
    const blade=new THREE.Mesh(new THREE.BoxGeometry(.04,.45,.02),M.blade);
    blade.position.y=.22;blade.rotation.z=i*(Math.PI*2/5);
    const pivot=new THREE.Group();pivot.add(blade);pivot.rotation.z=i*(Math.PI*2/5);radFan.add(pivot);
  }
  radFan.position.set(2.05,.5,0);radFan.rotation.y=Math.PI/2;engineG.add(radFan);

  // Water pump
  const pump=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.15,12),M.pump);
  pump.position.set(1.3,.15,.7);pump.rotation.x=Math.PI/2;engineG.add(pump);

  // Coolant hoses
  const hose1=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.4,8),M.coolPipe);
  hose1.position.set(1.7,.9,.35);hose1.rotation.z=-.4;engineG.add(hose1);
  const hose2=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.2,8),M.coolPipe);
  hose2.position.set(1.6,.1,.5);hose2.rotation.z=.3;engineG.add(hose2);
  const hose3=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.9,8),M.coolPipe);
  hose3.position.set(.8,.15,.85);hose3.rotation.y=Math.PI/2;engineG.add(hose3);

  // Thermostat housing
  const thermo=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),M.pump);
  thermo.position.set(1.1,.7,.55);engineG.add(thermo);

  // Oil pan
  const pan=new THREE.Mesh(new THREE.BoxGeometry(bw-.25,.32,bd-.2),new THREE.MeshStandardMaterial({color:0x2e2e36,metalness:.55,roughness:.4}));
  pan.position.y=-1.05;engineG.add(pan);

  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(2,10,10),M.glow).translateY(.3));
  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(1.6,8,8),M.tglow).translateY(1.0));
  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,8,8),M.cglow).translateY(.5).translateX(2.0));

  updateMats();
}

function updateMats(){
  const isD=eng.type==='diesel';
  blks.forEach(b=>{b.material=eng.transparent?(isD?M.dieselT:M.blockT):(isD?M.dieselS:M.blockS);});
  hds.forEach(h=>{h.material=eng.transparent?M.headT:M.headS;});
}

rebuild();

const smooth=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);};
function stall(reason){eng.stalled=true;eng.offReason=reason;eng.startT=0;}

function update(dt){
  const dsl=eng.type==='diesel',nC=cyls.length,st=eng.stalled,gm=eng.gear;
  eng.maxRpm=dsl?4800:7200;eng.idle=dsl?620:800;
  // gearbox: D = automatic, M = manual, R = reverse
  if(gm==='D'){
    V.t+=dt;if(Math.abs(V.v)<1)V.g=1;
    if(V.t>.7){
      if(eng.rpm>eng.idle+(eng.maxRpm-eng.idle)*(.38+.5*eng.throttle)&&V.g<6){V.g++;V.t=0;}
      else if(eng.rpm<eng.idle*1.4&&V.g>1){V.g--;V.t=0;}
    }
  }
  const G=(gm==='R'?-3.2:gm==='M'?(manualRatios[eng.manualGear]||1):gm==='D'?manualRatios[V.g]:0)*V.fin,drive=G!==0;
  // idle governor
  const err=(eng.idle-eng.rpm)/eng.idle;
  eng.idleI=Math.max(0,Math.min(.3,eng.idleI+err*.5*dt));
  const thr=Math.max(eng.throttle,Math.max(0,Math.min(.5,.03+eng.idleI+err*.9)));
  // turbo with rotor inertia + wastegate
  const bmax=dsl?1.8:1.2;
  const targetBoost = (eng.turbo&&!st&&eng.throttle>.12&&eng.rpm>1100)
    ? Math.min(eng.throttle*1.35,bmax)*Math.min(1,(eng.rpm-1100)/2500) : 0;
  // rotor dynamics: exhaust energy spins the turbine, inertia lags boost
  const exhaustPower = Math.max(0, eng.rpm/eng.maxRpm * (0.3+eng.throttle*0.9) * (eng.turbo?1:0.15));
  const targetOmega = exhaustPower * 1800; // rad/s scale
  eng.turboOmega += (targetOmega - eng.turboOmega) * Math.min(1, dt * (eng.turbo?1.8:4.5));
  eng.turboOmega = Math.max(0, eng.turboOmega);
  const inertiaBoost = Math.min(bmax, eng.turboOmega / 1500);
  // wastegate bleeds excess
  if(inertiaBoost > bmax*0.95) eng.turboOmega *= 0.992;
  eng.boost += (Math.min(inertiaBoost, targetBoost*1.05 + (eng.turbo?0.05:0)) - eng.boost) * Math.min(1, dt*3.5);
  eng.boost = Math.max(0, Math.min(bmax, eng.boost));
  // integrate crank + vehicle in small angle steps (<=5 deg) so pressure pulses are resolved
  const Q=makeQ(eng.rpm,thr,eng.boost,dsl,st||eng.startT>2.4||eng.rpm>eng.maxRpm+100);   // первые 0.6 с запуска — стартер крутит без топлива
  const fm=(.9+.0002*eng.rpm)*(dsl?1.25:1)*(eng.temp<85?1+(85-eng.temp)*.01:1);   // FMEP, bar
  const Tf=fm*1e5*nC*P.A*2*P.r/(4*Math.PI);
  const ns=Math.max(1,Math.min(240,Math.ceil(eng.omega*dt/.09))),h=dt/ns;
  const cap=drive?900*Math.min(1,Math.max(0,(eng.rpm-eng.idle*1.1)/(eng.idle*.9))):0;   // clutch/converter capacity
  const wmax=eng.maxRpm*1.15*TAU/60;
  let Tb=0,Tcs=0;
  for(let k=0;k<ns;k++){
    const w=eng.omega;let Tg=0;
    for(let i=0;i<nC;i++)Tg+=cylT(cyls[i].fire,eng.angle,w,Q);
    const Ts=(!st&&w<eng.idle*.45*TAU/60)?200:0;                       // starter
    const Tc=drive?Math.max(-cap,Math.min(cap,8*(w-G*V.v/V.R))):0;      // torque into driveline
    const Tfr=Tf*Math.min(1,w/5);
    eng.omega=Math.max(0,Math.min(wmax,w+(Tg-Tfr+Ts-Tc)/P.J*h));
    eng.angle+=eng.omega*h;
    const sg=Math.max(-1,Math.min(1,V.v*2));
    const F=(drive?Tc*G*.92/V.R:0)-sg*(V.m*9.81*.012+eng.brake*12000+(extraLoad?3200:0))-.39*V.v*Math.abs(V.v);
    V.v+=F/V.m*h;
    Tb+=(Tg-Tfr)*h;Tcs+=Tc*h;
  }
  if(gm==='P')V.v=0;
  eng.angle%=FOUR;eng.rpm=eng.omega*60/TAU;
  const dtSafe=Math.max(dt,1e-4);
  eng.torque+=(Tb/dtSafe-eng.torque)*Math.min(1,dt*6);
  if(!isFinite(eng.torque))eng.torque=0;
  const Tref=Math.max(1e-6,nC*P.A*2*P.r*12e5/(4*Math.PI));
  const loadRaw=Tcs/dtSafe/Tref*100;
  eng.load+=(Math.max(0,Math.min(100,isFinite(loadRaw)?loadRaw:0))-eng.load)*Math.min(1,dt*6);
  if(!isFinite(eng.load))eng.load=0;
  eng.power=Math.round(Math.max(0,eng.torque)*eng.omega/735.5);
  if(!isFinite(eng.power))eng.power=0;
  const load=eng.load;

  // ===== Нагрев и охлаждение =====
  // Тепло в ОЖ ≈ индикаторная мощность (полезная + трение). Без нагрузки это только трение — термостат его держит.
  // Отвод ∝ (T − воздух) × производительность × открытие термостата — у системы есть равновесие.
  const sz=nC/4;                                                   // V6 — больше мотор, радиатор и масса
  const pInd=st?0:Math.max(0,eng.torque+Tf)*eng.omega/1000;         // кВт
  const qIn=st?0:2*sz+.85*pInd;
  eng.coolFlow=.25+.75*Math.min(1,eng.rpm/(eng.maxRpm*.5));         // помпа от коленвала; стоит — термосифон
  if(eng.temp>97)eng.fanOn=true;else if(eng.temp<92)eng.fanOn=false;
  const ram=Math.min(.6,Math.abs(V.v)/25);                          // набегающий поток от скорости
  const air=Math.min(1,.4+.3*Math.min(1,eng.rpm/(eng.maxRpm*.55))+(eng.fanOn?.45:0)+ram);
  const capC=eng.coolFlow*air*(1-eng.wear/250);                     // износ забивает систему
  eng.coolEff=capC*100;
  eng.thermoOpen+=(Math.max(.04,smooth(84,98,eng.temp))-eng.thermoOpen)*Math.min(1,dt*1.5);   // термостат 84°→98°
  const qOut=1.25*sz*capC*eng.thermoOpen*(eng.temp-AMBIENT)+.02*sz*(eng.temp-AMBIENT);
  eng.temp+=(qIn-qOut)/(HEAT_CAP*sz)*dt;
  if(!isFinite(eng.temp))eng.temp=88;
  eng.temp=Math.max(AMBIENT,Math.min(155,eng.temp));

  // ===== Износ =====
  if(!st){
    if(eng.rpm>eng.maxRpm*.97)eng.wear+=dt*.03;                     // долбит отсечку
    if(load>75&&eng.throttle>.8&&eng.temp>108)eng.wear+=dt*.1;      // тяжёлая нагрузка в пол на горячем моторе
    if(eng.turbo&&eng.temp>110)eng.wear+=dt*.3;
  }
  if(eng.temp>115)eng.wear+=dt*(eng.temp-115)*.05;                  // перегрев — главный убийца
  eng.wear=Math.min(100,eng.wear);
  if(!st){
    if(eng.temp>=145)stall('overheat');
    else if(eng.wear>=100)stall('wear');
  }
  // попытка запуска: схватил — ок, нет за 3 с — не завёлся
  if(eng.startT>0){
    eng.startT-=dt;
    if(eng.rpm>eng.idle*.8)eng.startT=0;
    else if(eng.startT<=0){eng.startT=0;stall('nostart');toast('Не завёлся');}
  }

  turbos.forEach((t,i)=>{if(t.userData.blades)t.userData.blades.rotation.x += (eng.turboOmega*0.018 + eng.boost*0.25)*(i?1:-1)*dt*60;});
  if(radFan)radFan.rotation.x += ((st?0:eng.coolFlow*.4)+(eng.fanOn?.35:st?0:.05))*dt*60;

  ui();sound();
  const hf=Math.max(0,(eng.temp-95)/55);
  heatL.intensity=hf*2.5;M.glow.opacity=hf*.15;
  turboL.intensity=eng.turbo?1.1+eng.boost*.9:0;M.tglow.opacity=eng.turbo?.07+eng.boost*.05:0;
  coolL.intensity=eng.coolEff/100*1.2;M.cglow.opacity=eng.coolEff/100*.08;
  turbos.forEach(t=>{if(t.children[0])t.children[0].material=eng.boost>.5?M.turboHot:M.turboBody;});
}

function ui(){
  const s=(v,fb=0)=>isFinite(v)?v:fb;
  document.getElementById('rpmVal').textContent=Math.round(s(eng.rpm,800));
  document.getElementById('loadVal').textContent=Math.round(s(eng.load))+'%';
  document.getElementById('tempVal').textContent=Math.round(s(eng.temp,85))+'°';
  document.getElementById('coolVal').textContent=Math.round(s(eng.coolEff,90))+'%';
  document.getElementById('pwrVal').textContent=Math.round(s(eng.power));
  if(eng.gear==='D')document.getElementById('gearVal').textContent='D'+V.g;
  document.getElementById('boostVal').textContent=s(eng.boost).toFixed(1);
  const wv=document.getElementById('wearVal');wv.textContent=Math.floor(s(eng.wear))+'%';
  wv.style.color=eng.wear<40?'#aed581':eng.wear<75?'#ffb74d':'#ef5350';

  const crank=eng.startT>0;
  const sb=document.getElementById('startBtn'),sbS=crank?'crank':eng.stalled?'off':'on';
  if(sb.dataset.s!==sbS){
    sb.dataset.s=sbS;
    sb.textContent=sbS==='crank'?'СТАРТЕР…':sbS==='off'?'ЗАВЕСТИ':'ЗАГЛУШИТЬ';
    sb.className='btn btn-start'+(sbS==='on'?'':' '+sbS);
  }

  const st=document.getElementById('status'),w=document.getElementById('warn');
  const temp=s(eng.temp,88), rpm=s(eng.rpm,800);
  const set=(txt,cls,warn)=>{st.textContent=txt;st.className='status '+cls;w.style.display=warn?'block':'none';if(warn)w.textContent=warn;};
  const why={overheat:'ЗАГЛОХ: ПЕРЕГРЕВ',wear:'ЗАГЛОХ: ИЗНОС',nostart:'НЕ ЗАВЁЛСЯ'};
  if(crank)set('СТАРТЕР','warn');
  else if(eng.stalled&&eng.offReason==='off')set('ВЫКЛ','off');
  else if(eng.stalled)set('ЗАГЛОХ','danger',why[eng.offReason]||'ДВИГАТЕЛЬ ЗАГЛОХ!');
  else if(temp>130||eng.wear>85)set('АВАРИЯ','danger',temp>130?'ПЕРЕГРЕВ!':'КРИТИЧЕСКИЙ ИЗНОС!');
  else if(temp>115||rpm>eng.maxRpm*.9)set('НАГРУЗКА','warn');
  else set('ГОТОВ','ok');
}
function sound(){updateSound();}

function animate(){
  const th=eng.angle;
  cyls.forEach((cy,i)=>{
    const al=th-cy.fire,s=Math.sin(al),co=Math.cos(al),q=Math.sqrt(LS*LS-RS*RS*s*s);
    cy.piston.position.y=RS*co+q;                                   // piston pin height above crank axis
    cy.rod.position.y=RS*co;cy.rod.position.z=RS*s;                 // big end sits on the crank pin
    cy.rod.rotation.x=-Math.asin(Math.min(1,Math.max(-1,RS*s/LS))); // rod tilt
    const c=((al%FOUR)+FOUR)%FOUR,cc=c>=3*Math.PI?c-FOUR:c;
    if(injectors[i])injectors[i].scale.y=1+(eng.stalled?0:.25*Math.exp(-Math.pow((cc+.3)/.3,2)));
    // Valve lift. c=0 is firing TDC. Exhaust EVO~0.8π…EVC~2.1π. Intake ~1.9π…~3.2π.
    const lift = (start,dur)=>{
      let a=((c-start)%FOUR+FOUR)%FOUR;
      if(a>dur)return 0;
      return Math.sin(a/dur*Math.PI)*0.085;
    };
    const eLift = lift(0.8*Math.PI, 1.3*Math.PI);   // exhaust 144°→378°
    const iLift = lift(1.9*Math.PI, 1.3*Math.PI);   // intake 342°→576°
    // valves move DOWN into the cylinder when open
    if(cy.iv1){cy.iv1.position.y=0.02-iLift; cy.iv2.position.y=0.02-iLift;}
    if(cy.ev1){cy.ev1.position.y=0.02-eLift; cy.ev2.position.y=0.02-eLift;}
    // Spark (petrol) flashes near firing TDC; diesel glow plug on during start / cold
    if(cy.spark && cy.spark.children[1]){
      const isD=eng.type==='diesel';
      let em=0.2;
      if(isD) em = (eng.startT>0 || eng.temp<60) ? 1.4 : 0.15;
      else {
        const nearFire = Math.abs(cc)<0.25 || Math.abs(cc-FOUR)<0.25;
        em = nearFire && !eng.stalled ? 1.8 : 0.25;
      }
      cy.spark.children[1].material.emissiveIntensity = em;
    }
  });
  if(crankG)crankG.rotation.x=th;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);animate();controls.update();renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);});
</script>
</body>
