<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Engine Load Sim 3D Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#e0e0e0;font-family:system-ui,sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;user-select:none;touch-action:none}
header{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;background:#0c0c0c;border-bottom:1px solid #1a1a1a;z-index:20}
header h1{font-size:12px;font-weight:600;letter-spacing:1px}
.status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.status.ok{background:#0a2a0a;color:#4caf50}.status.warn{background:#2a1a00;color:#ff9800}
.status.danger{background:#2a0a0a;color:#f44336;animation:p .7s infinite}
@keyframes p{50%{opacity:.55}}
#view{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;pointer-events:none;z-index:5}
.metric{background:rgba(0,0,0,.6);border:1px solid #2a2a2a;border-radius:8px;padding:4px 7px;min-width:54px;text-align:center}
.metric .val{font-size:14px;font-weight:700}.metric .lbl{font-size:8px;color:#777;text-transform:uppercase}
.metric.rpm .val{color:#4fc3f7}.metric.load .val{color:#ffb74d}.metric.temp .val{color:#ef5350}
.metric.power .val{color:#81c784}.metric.boost .val{color:#ff80ab}.metric.gear .val{color:#ce93d8}
.metric.cool .val{color:#4dd0e1}
.warning{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(200,30,30,.9);color:#fff;padding:5px 14px;border-radius:16px;font-size:12px;font-weight:700;display:none;z-index:5}
.controls{background:#0c0c0c;border-top:1px solid #1a1a1a;padding:7px 8px 12px;z-index:20}
.row{display:flex;gap:5px;margin-bottom:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.gear,.shift,.tbtn,.pm{height:34px;border-radius:8px;border:2px solid #2a2a2a;background:#141414;color:#888;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px}
.gear{width:34px}.shift,.pm{width:34px;border-color:#444;color:#ddd}
.gear.active-p{border-color:#42a5f5;color:#42a5f5;background:#0b1a2a}
.gear.active-r{border-color:#ef5350;color:#ef5350;background:#2a0e0e}
.gear.active-n,.gear.active-d{border-color:#66bb6a;color:#66bb6a;background:#0e2a10}
.gear.active-m{border-color:#ffb74d;color:#ffb74d;background:#2a1c08}
.shift-btns{display:none;gap:4px}.shift-btns.show{display:flex}
.tbtn.active{border-color:#4fc3f7;color:#4fc3f7}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.slider-box{background:#141414;border-radius:8px;padding:5px 8px;border:1px solid #222}
.slider-box label{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#888;margin-bottom:3px}
.slider-box label span{color:#eee;font-weight:600}
.pm-row{display:flex;gap:4px;align-items:center}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:#2a2a2a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid #fff;cursor:pointer}
#gas::-webkit-slider-thumb{background:#ffb74d}#brake::-webkit-slider-thumb{background:#ef5350}
.btn-row{display:flex;gap:5px}
.btn{flex:1;height:32px;border-radius:7px;border:none;font-size:10px;font-weight:600;cursor:pointer}
.btn-reset{background:#222;color:#bbb}
.btn-load{background:#1f1500;color:#ffb74d;border:1px solid #4a3500}
.btn-load.active{background:#ff9800;color:#111}
.btn-turbo{background:#1a0a2a;color:#ce93d8;border:1px solid #4a2a6a}
.btn-turbo.active{background:#9c27b0;color:#fff}
.btn-repair{background:#0f1f0f;color:#81c784;border:1px solid #1f3a1f}
.view-btns{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;z-index:5}
.view-btn,.sound-btn{background:rgba(0,0,0,.65);border:1px solid #333;color:#aaa;font-size:9px;padding:4px 8px;border-radius:6px;cursor:pointer}
.view-btn.active{border-color:#4fc3f7;color:#4fc3f7}
.sound-btn{position:absolute;bottom:8px;left:8px;z-index:5}
.sound-btn.on{border-color:#81c784;color:#81c784}
</style>
</head>
<body>
<header>
  <h1>ENGINE LOAD SIM 3D PRO</h1>
  <div class="status ok" id="status">ГОТОВ</div>
</header>
<div id="view">
  <div class="hud">
    <div class="metric rpm"><div class="val" id="rpmVal">800</div><div class="lbl">об/мин</div></div>
    <div class="metric load"><div class="val" id="loadVal">0%</div><div class="lbl">нагрузка</div></div>
    <div class="metric temp"><div class="val" id="tempVal">85°</div><div class="lbl">темп</div></div>
    <div class="metric cool"><div class="val" id="coolVal">90%</div><div class="lbl">охлажд</div></div>
    <div class="metric power"><div class="val" id="pwrVal">0</div><div class="lbl">л.с.</div></div>
    <div class="metric boost"><div class="val" id="boostVal">0.0</div><div class="lbl">буст</div></div>
    <div class="metric gear"><div class="val" id="gearVal">P</div><div class="lbl">передача</div></div>
  </div>
  <div class="warning" id="warn">ПЕРЕГРЕВ!</div>
  <div class="view-btns">
    <div class="view-btn active" data-view="trans">ПРОЗРАЧНЫЙ</div>
    <div class="view-btn" data-view="solid">СБОРКА</div>
  </div>
  <div class="sound-btn" id="soundBtn">🔊 ЗВУК</div>
</div>
<div class="controls">
  <div class="row">
    <div class="tbtn active" data-type="petrol">БЕНЗИН</div>
    <div class="tbtn" data-type="diesel">ДИЗЕЛЬ</div>
    <div class="tbtn active" data-var="i4">I4</div>
    <div class="tbtn" data-var="v6">V6</div>
  </div>
  <div class="row">
    <div class="gear active-p" data-gear="P">P</div>
    <div class="gear" data-gear="R">R</div>
    <div class="gear" data-gear="N">N</div>
    <div class="gear" data-gear="D">D</div>
    <div class="gear" data-gear="M">M</div>
    <div class="shift-btns" id="shiftBtns">
      <div class="shift" id="gearDown">−</div>
      <div class="shift" id="gearUp">+</div>
    </div>
  </div>
  <div class="sliders">
    <div class="slider-box">
      <label>ГАЗ <span id="gasVal">0%</span></label>
      <div class="pm-row">
        <div class="pm" id="gasMinus">−</div>
        <input type="range" id="gas" min="0" max="100" value="0" style="flex:1">
        <div class="pm" id="gasPlus">+</div>
      </div>
    </div>
    <div class="slider-box">
      <label>ТОРМОЗ <span id="brakeVal">0%</span></label>
      <div class="pm-row">
        <div class="pm" id="brakeMinus">−</div>
        <input type="range" id="brake" min="0" max="100" value="0" style="flex:1">
        <div class="pm" id="brakePlus">+</div>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-reset" id="resetBtn">СБРОС</button>
    <button class="btn btn-load" id="loadBtn">+ НАГРУЗКА</button>
    <button class="btn btn-turbo" id="turboBtn">TWIN-TURBO</button>
    <button class="btn btn-repair" id="repairBtn">РЕМОНТ</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const eng={
  rpm:800,throttle:0,brake:0,gear:'P',manualGear:1,temp:85,power:0,wear:0,
  maxRpm:7200,idle:800,angle:0,transparent:true,turbo:false,stalled:false,boost:0,
  type:'petrol',variant:'i4',coolEff:90,coolFlow:0
};
const gearRatio={P:0,R:-.35,N:0,D:1,M:1};
const manualRatios=[0,3.5,2.2,1.5,1.1,.85,.7];
let extraLoad=false;

// Audio
let audioCtx,osc,gainNode,noiseGain,soundOn=false;
function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();gainNode.gain.value=0;gainNode.connect(audioCtx.destination);
  osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=40;
  const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  osc.connect(f);f.connect(gainNode);osc.start();
  const buf=audioCtx.createBuffer(1,2*audioCtx.sampleRate,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=audioCtx.createBufferSource();n.buffer=buf;n.loop=true;
  noiseGain=audioCtx.createGain();noiseGain.gain.value=0;
  const nf=audioCtx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=350;
  n.connect(nf);nf.connect(noiseGain);noiseGain.connect(gainNode);n.start();
}
function updateSound(){
  if(!soundOn||!audioCtx||eng.stalled){if(gainNode)gainNode.gain.setTargetAtTime(0,audioCtx.currentTime,.1);return;}
  const n=eng.rpm/eng.maxRpm;
  const base=eng.type==='diesel'?26:36;
  osc.frequency.setTargetAtTime(base+n*(eng.type==='diesel'?130:185),audioCtx.currentTime,.05);
  let vol=.06+eng.throttle*.2+(eng.turbo?.09:0)+eng.boost*.04;
  if(eng.type==='diesel')vol*=1.12;
  gainNode.gain.setTargetAtTime(Math.min(.48,vol),audioCtx.currentTime,.08);
  noiseGain.gain.setTargetAtTime(.02+n*.06,audioCtx.currentTime,.08);
}
document.getElementById('soundBtn').onclick=function(){
  initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
  soundOn=!soundOn;this.classList.toggle('on',soundOn);
  this.textContent=soundOn?'🔊 ЗВУК ВКЛ':'🔊 ЗВУК';
  if(!soundOn&&gainNode)gainNode.gain.setTargetAtTime(0,audioCtx.currentTime,.1);
};

// UI helpers
function setGas(v){v=Math.max(0,Math.min(100,v));gasEl.value=v;eng.throttle=v/100;document.getElementById('gasVal').textContent=v+'%';}
function setBrake(v){v=Math.max(0,Math.min(100,v));brakeEl.value=v;eng.brake=v/100;document.getElementById('brakeVal').textContent=v+'%';}

document.querySelectorAll('.gear').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('.gear').forEach(g=>g.className='gear');
    el.classList.add('active-'+el.dataset.gear.toLowerCase());
    eng.gear=el.dataset.gear;
    document.getElementById('shiftBtns').classList.toggle('show',eng.gear==='M');
    document.getElementById('gearVal').textContent=eng.gear==='M'?'M'+eng.manualGear:eng.gear;
  };
});
document.getElementById('gearUp').onclick=()=>{if(eng.manualGear<6){eng.manualGear++;document.getElementById('gearVal').textContent='M'+eng.manualGear;}};
document.getElementById('gearDown').onclick=()=>{if(eng.manualGear>1){eng.manualGear--;document.getElementById('gearVal').textContent='M'+eng.manualGear;}};

document.querySelectorAll('.tbtn').forEach(btn=>{
  btn.onclick=()=>{
    if(btn.dataset.type){document.querySelectorAll('[data-type]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');eng.type=btn.dataset.type;rebuild();}
    if(btn.dataset.var){document.querySelectorAll('[data-var]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');eng.variant=btn.dataset.var;rebuild();}
  };
});

const gasEl=document.getElementById('gas'),brakeEl=document.getElementById('brake');
gasEl.oninput=()=>setGas(+gasEl.value);
brakeEl.oninput=()=>setBrake(+brakeEl.value);
document.getElementById('gasPlus').onclick=()=>setGas(+gasEl.value+5);
document.getElementById('gasMinus').onclick=()=>setGas(+gasEl.value-5);
document.getElementById('brakePlus').onclick=()=>setBrake(+brakeEl.value+5);
document.getElementById('brakeMinus').onclick=()=>setBrake(+brakeEl.value-5);

document.getElementById('resetBtn').onclick=()=>{
  Object.assign(eng,{rpm:800,temp:85,wear:0,throttle:0,brake:0,stalled:false,manualGear:1,turbo:false,boost:0,coolEff:90});
  setGas(0);setBrake(0);
  document.getElementById('loadBtn').classList.remove('active');document.getElementById('turboBtn').classList.remove('active');
  extraLoad=false;document.getElementById('gearVal').textContent=eng.gear;
};
document.getElementById('loadBtn').onclick=function(){extraLoad=!extraLoad;this.classList.toggle('active',extraLoad);};
document.getElementById('turboBtn').onclick=function(){eng.turbo=!eng.turbo;this.classList.toggle('active',eng.turbo);};
document.getElementById('repairBtn').onclick=()=>{eng.wear=Math.max(0,eng.wear-50);eng.temp=Math.max(70,eng.temp-40);eng.stalled=false;eng.coolEff=Math.min(100,eng.coolEff+20);};

document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.onclick=()=>{document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');eng.transparent=btn.dataset.view==='trans';updateMats();};
});

// THREE
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(view.clientWidth,view.clientHeight);
renderer.shadowMap.enabled=true;
view.insertBefore(renderer.domElement,view.firstChild);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050505);
scene.fog=new THREE.Fog(0x050505,10,22);

const camera=new THREE.PerspectiveCamera(36,view.clientWidth/view.clientHeight,.1,60);
camera.position.set(4.5,2.8,6.2);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=3;controls.maxDistance=13;controls.target.set(0,.4,0);controls.update();

scene.add(new THREE.AmbientLight(0x505060,1.0));
const dir=new THREE.DirectionalLight(0xffffff,1.25);dir.position.set(5,8,4);dir.castShadow=true;scene.add(dir);
const fill=new THREE.PointLight(0x4fc3f7,.45,16);fill.position.set(-3,3,4);scene.add(fill);
const heatL=new THREE.PointLight(0xff5500,0,8);heatL.position.set(0,.7,0);scene.add(heatL);
const turboL=new THREE.PointLight(0xaa44ff,0,7);turboL.position.set(0,1.4,0);scene.add(turboL);
const coolL=new THREE.PointLight(0x4dd0e1,0,6);coolL.position.set(2.2,.8,0);scene.add(coolL);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshStandardMaterial({color:0x080808,roughness:.95,metalness:.05}));
ground.rotation.x=-Math.PI/2;ground.position.y=-1.5;ground.receiveShadow=true;scene.add(ground);
scene.add(new THREE.GridHelper(14,28,0x181818,0x0e0e0e).translateY(-1.49));

const M={
  blockT:new THREE.MeshPhysicalMaterial({color:0x9a9aa8,metalness:.65,roughness:.22,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}),
  blockS:new THREE.MeshPhysicalMaterial({color:0x6a6a72,metalness:.8,roughness:.28}),
  dieselT:new THREE.MeshPhysicalMaterial({color:0x6a6a7a,metalness:.7,roughness:.25,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false}),
  dieselS:new THREE.MeshPhysicalMaterial({color:0x4a4a58,metalness:.75,roughness:.3}),
  piston:new THREE.MeshStandardMaterial({color:0xd0d0d8,metalness:.92,roughness:.18}),
  ring:new THREE.MeshStandardMaterial({color:0x888890,metalness:.85,roughness:.25}),
  rod:new THREE.MeshStandardMaterial({color:0xb8b8c0,metalness:.95,roughness:.12}),
  crank:new THREE.MeshStandardMaterial({color:0xe0e0e8,metalness:.9,roughness:.15}),
  headT:new THREE.MeshPhysicalMaterial({color:0x888890,metalness:.55,roughness:.28,transparent:true,opacity:.22,depthWrite:false}),
  headS:new THREE.MeshPhysicalMaterial({color:0x55555e,metalness:.65,roughness:.3}),
  pipe:new THREE.MeshStandardMaterial({color:0x3a3a42,metalness:.75,roughness:.4}),
  coolPipe:new THREE.MeshStandardMaterial({color:0x2a6a7a,metalness:.6,roughness:.35}),
  rad:new THREE.MeshStandardMaterial({color:0x3a4a5a,metalness:.7,roughness:.3}),
  turboBody:new THREE.MeshStandardMaterial({color:0x7a7a88,metalness:.85,roughness:.22}),
  turboHot:new THREE.MeshStandardMaterial({color:0xb86840,metalness:.7,roughness:.3}),
  blade:new THREE.MeshStandardMaterial({color:0xc0c0d0,metalness:.9,roughness:.15}),
  inj:new THREE.MeshStandardMaterial({color:0x1a1a1e,metalness:.5,roughness:.35}),
  pump:new THREE.MeshStandardMaterial({color:0x4a4a55,metalness:.8,roughness:.25}),
  glow:new THREE.MeshBasicMaterial({color:0xff5500,transparent:true,opacity:0}),
  tglow:new THREE.MeshBasicMaterial({color:0xaa44ff,transparent:true,opacity:0}),
  cglow:new THREE.MeshBasicMaterial({color:0x4dd0e1,transparent:true,opacity:0})
};

let engineG=new THREE.Group();scene.add(engineG);
let pistons=[],rods=[],turbos=[],injectors=[],crankG,blockMesh,headMesh,radFan;

function clear(){while(engineG.children.length)engineG.remove(engineG.children[0]);pistons=[];rods=[];turbos=[];injectors=[];}

function makeTurbo(x,y,z,rotY){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.3,14,11),M.turboBody));
  const comp=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.11,14),M.turboBody);
  comp.position.x=-.26;comp.rotation.z=Math.PI/2;g.add(comp);
  const turb=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,.11,14),M.turboBody);
  turb.position.x=.26;turb.rotation.z=Math.PI/2;g.add(turb);
  const bladeG=new THREE.Group();
  for(let i=0;i<8;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.018,.16,.05),M.blade);
    const a=i*Math.PI*2/8;
    b.position.set(-.26,Math.cos(a)*.08,Math.sin(a)*.08);b.rotation.x=a;bladeG.add(b);
  }
  for(let i=0;i<10;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(.014,.14,.04),M.blade);
    const a=i*Math.PI*2/10;
    b.position.set(.26,Math.cos(a)*.07,Math.sin(a)*.07);b.rotation.x=a;bladeG.add(b);
  }
  g.add(bladeG);
  const inP=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,.32,8),M.pipe);
  inP.position.set(-.48,.04,0);inP.rotation.z=Math.PI/2;g.add(inP);
  const outP=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,.36,8),M.pipe);
  outP.position.set(.12,.3,0);outP.rotation.z=-.55;g.add(outP);
  g.position.set(x,y,z);g.rotation.y=rotY;g.userData.blades=bladeG;
  return g;
}

function rebuild(){
  clear();
  const isV=eng.variant==='v6',isD=eng.type==='diesel';
  const positions=[];
  if(isV){for(let i=0;i<3;i++){positions.push({x:-.55+i*.55,z:.42,bank:1});positions.push({x:-.55+i*.55,z:-.42,bank:-1});}}
  else{[-.95,-.32,.32,.95].forEach(x=>positions.push({x,z:0,bank:0}));}
  const bw=isV?2.3:2.7,bd=isV?1.7:1.2;

  blockMesh=new THREE.Mesh(new THREE.BoxGeometry(bw,1.2,bd),isD?M.dieselT:M.blockT);
  blockMesh.position.y=.25;engineG.add(blockMesh);
  headMesh=new THREE.Mesh(new THREE.BoxGeometry(bw+.12,.3,bd+.12),M.headT);
  headMesh.position.y=.95;engineG.add(headMesh);

  positions.forEach((p,i)=>{
    const liner=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.95,18,1,true),
      new THREE.MeshStandardMaterial({color:0x2a2a32,metalness:.4,roughness:.45,side:THREE.DoubleSide,transparent:true,opacity:.55}));
    liner.position.set(p.x,.32,p.z);if(p.bank)liner.rotation.z=p.bank*.28;engineG.add(liner);

    const pist=new THREE.Group();
    pist.add(new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.28,16),M.piston));
    const crown=new THREE.Mesh(new THREE.CylinderGeometry(.19,.185,.04,16),new THREE.MeshStandardMaterial({color:0xa0a0a8,metalness:.7,roughness:.3}));
    crown.position.y=.16;pist.add(crown);
    for(let r=0;r<3;r++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.192,.008,5,20),M.ring);ring.rotation.x=Math.PI/2;ring.position.y=.05-r*.06;pist.add(ring);}
    pist.position.set(p.x,.42,p.z);engineG.add(pist);pistons.push({m:pist,bank:p.bank});

    const rod=new THREE.Group();
    rod.add(new THREE.Mesh(new THREE.BoxGeometry(.05,.52,.07),M.rod));
    const big=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.08,10),M.rod);big.rotation.z=Math.PI/2;big.position.y=-.28;rod.add(big);
    const small=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.06,8),M.rod);small.rotation.z=Math.PI/2;small.position.y=.26;rod.add(small);
    rod.position.set(p.x,-.08,p.z);engineG.add(rod);rods.push({m:rod,bank:p.bank});

    const inj=new THREE.Group();
    inj.add(new THREE.Mesh(new THREE.CylinderGeometry(.04,.03,.2,8),M.inj));
    const tip=new THREE.Mesh(new THREE.ConeGeometry(.025,.08,8),M.inj);tip.position.y=-.14;inj.add(tip);
    inj.position.set(p.x,1.12,p.z);if(p.bank)inj.rotation.z=p.bank*.2;engineG.add(inj);injectors.push(inj);
  });

  crankG=new THREE.Group();crankG.position.y=-.55;engineG.add(crankG);
  const main=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,isV?2.2:2.6,12),M.crank);main.rotation.z=Math.PI/2;crankG.add(main);
  positions.forEach(p=>{
    const pin=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.16,10),M.crank);pin.rotation.z=Math.PI/2;pin.position.set(p.x,0,p.z*.25);crankG.add(pin);
    const cw=new THREE.Mesh(new THREE.BoxGeometry(.11,.3,.09),M.crank);cw.position.set(p.x,0,0);crankG.add(cw);
  });

  // Turbos
  engineG.add(makeTurbo(-1.75,.7,isV?.75:.75,0));
  engineG.add(makeTurbo(1.75,.7,isV?-.75:-.75,Math.PI));
  turbos=engineG.children.filter(c=>c.userData&&c.userData.blades);

  [-1,1].forEach(side=>{
    const ex=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,1.2,8),M.pipe);
    ex.position.set(side*.95,.95,side*(isV?.55:.6));ex.rotation.z=side*.45;ex.rotation.x=.25;engineG.add(ex);
  });

  // === COOLING SYSTEM ===
  // Radiator
  const rad=new THREE.Mesh(new THREE.BoxGeometry(.25,1.1,1.4),M.rad);
  rad.position.set(2.3,.5,0);engineG.add(rad);
  // Radiator core detail
  for(let i=0;i<6;i++){
    const fin=new THREE.Mesh(new THREE.BoxGeometry(.02,1.0,1.3),new THREE.MeshStandardMaterial({color:0x2a3a4a,metalness:.5,roughness:.4}));
    fin.position.set(2.3,-.05+i*.18,0);engineG.add(fin);
  }
  // Fan
  radFan=new THREE.Group();
  const fanHub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.06,10),M.pump);
  radFan.add(fanHub);
  for(let i=0;i<5;i++){
    const blade=new THREE.Mesh(new THREE.BoxGeometry(.04,.45,.02),M.blade);
    blade.position.y=.22;blade.rotation.z=i*(Math.PI*2/5);
    const pivot=new THREE.Group();pivot.add(blade);pivot.rotation.z=i*(Math.PI*2/5);radFan.add(pivot);
  }
  radFan.position.set(2.05,.5,0);radFan.rotation.y=Math.PI/2;engineG.add(radFan);

  // Water pump
  const pump=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.15,12),M.pump);
  pump.position.set(1.3,.15,.7);pump.rotation.x=Math.PI/2;engineG.add(pump);

  // Coolant hoses
  const hose1=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.4,8),M.coolPipe);
  hose1.position.set(1.7,.9,.35);hose1.rotation.z=-.4;engineG.add(hose1);
  const hose2=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.2,8),M.coolPipe);
  hose2.position.set(1.6,.1,.5);hose2.rotation.z=.3;engineG.add(hose2);
  const hose3=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.9,8),M.coolPipe);
  hose3.position.set(.8,.15,.85);hose3.rotation.y=Math.PI/2;engineG.add(hose3);

  // Thermostat housing
  const thermo=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),M.pump);
  thermo.position.set(1.1,.7,.55);engineG.add(thermo);

  // Oil pan
  const pan=new THREE.Mesh(new THREE.BoxGeometry(bw-.25,.32,bd-.2),new THREE.MeshStandardMaterial({color:0x2e2e36,metalness:.55,roughness:.4}));
  pan.position.y=-1.05;engineG.add(pan);

  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(2,10,10),M.glow).translateY(.3));
  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(1.6,8,8),M.tglow).translateY(1.0));
  engineG.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,8,8),M.cglow).translateY(.5).translateX(2.0));

  updateMats();
}

function updateMats(){
  if(!blockMesh)return;
  const isD=eng.type==='diesel';
  blockMesh.material=eng.transparent?(isD?M.dieselT:M.blockT):(isD?M.dieselS:M.blockS);
  headMesh.material=eng.transparent?M.headT:M.headS;
}

rebuild();

// Physics — fixed M1 heat bug
function update(dt){
  if(eng.stalled){
    eng.rpm=Math.max(0,eng.rpm-950*dt);eng.power=0;eng.boost=Math.max(0,eng.boost-2.2*dt);
    eng.coolFlow=Math.max(0,eng.coolFlow-dt*.5);
    ui();sound();return;
  }
  let ratio=gearRatio[eng.gear];
  if(eng.gear==='M')ratio=manualRatios[eng.manualGear]||1;
  const drive=Math.abs(ratio)>.01 && eng.gear!=='N' && eng.gear!=='P';

  eng.maxRpm=eng.type==='diesel'?4800:7200;
  eng.idle=eng.type==='diesel'?620:800;

  let target=eng.idle+eng.throttle*(eng.maxRpm-eng.idle);
  if(eng.turbo)target=Math.min(eng.maxRpm+250,target*1.1);

  // Load only when actually driving AND throttle/brake present
  let load=0;
  if(drive){
    if(extraLoad)load+=42;
    if(eng.brake>0)load+=eng.brake*55;
    // gear ratio load only if throttle is applied (fixes M1 idle heat)
    if(eng.gear==='M' && eng.throttle>0.05) load+=(6-eng.manualGear)*3.5;
    else if(eng.gear==='D' && eng.throttle>0.05) load+=8;
  }

  const drop=load*(eng.type==='diesel'?26:36);
  eng.rpm+=(Math.max(eng.idle*.5,target-drop)-eng.rpm)*(eng.type==='diesel'?3.0:4.2)*dt;
  eng.rpm=Math.max(200,Math.min(eng.maxRpm+500,eng.rpm));

  if(eng.turbo&&eng.throttle>.12&&eng.rpm>1100)eng.boost+=(eng.throttle*1.35-eng.boost)*dt*2.2;
  else eng.boost=Math.max(0,eng.boost-1.7*dt);
  eng.boost=Math.min(eng.type==='diesel'?2.6:1.7,eng.boost);

  const rf=eng.rpm/eng.maxRpm;
  let pwr=eng.throttle*(eng.type==='diesel'?350:290)*rf*(1-load/165);
  if(eng.turbo)pwr*=(1+eng.boost*.5);
  if(eng.variant==='v6')pwr*=1.32;
  eng.power=Math.round(Math.max(0,pwr));

  // Cooling system
  eng.coolFlow = Math.min(1, eng.rpm/3000); // pump speed
  const fanBonus = eng.temp>95 ? 0.4 : 0;
  eng.coolEff = Math.min(100, 55 + eng.coolFlow*35 + fanBonus*20 - eng.wear*0.15);

  let heat=(eng.rpm/900)*.7 + load*.14 + eng.throttle*2.0;
  if(eng.turbo)heat*=1.3+eng.boost*.25;
  if(eng.type==='diesel')heat*=1.06;
  // cooling removes heat
  const cooling = (eng.coolEff/100)*2.8 + (eng.temp>100?0.6:0);
  eng.temp += (heat - cooling)*dt;
  eng.temp=Math.max(65,Math.min(152,eng.temp));

  if(eng.temp>120||eng.rpm>eng.maxRpm*.94)eng.wear+=dt*2.0;
  if(load>75&&eng.throttle>.8)eng.wear+=dt*1.6;
  if(eng.turbo&&eng.temp>110)eng.wear+=dt*1.4;
  if(eng.temp>145||eng.wear>97)eng.stalled=true;

  eng.angle+=(eng.rpm/60)*Math.PI*2*dt;

  turbos.forEach((t,i)=>{if(t.userData.blades)t.userData.blades.rotation.x+=(eng.boost*.55+eng.rpm/9000)*(i?1:-1);});
  if(radFan)radFan.rotation.x += (eng.coolFlow*0.4 + (eng.temp>95?0.35:0.05));

  ui();sound();
  const hf=Math.max(0,(eng.temp-95)/55);
  heatL.intensity=hf*2.5;M.glow.opacity=hf*.15;
  turboL.intensity=eng.turbo?1.1+eng.boost*.9:0;M.tglow.opacity=eng.turbo?.07+eng.boost*.05:0;
  coolL.intensity=eng.coolEff/100*1.2;M.cglow.opacity=eng.coolEff/100*.08;
  turbos.forEach(t=>{if(t.children[0])t.children[0].material=eng.boost>.5?M.turboHot:M.turboBody;});
}

function ui(){
  document.getElementById('rpmVal').textContent=Math.round(eng.rpm);
  let l=0;if(extraLoad)l+=42;if(eng.brake>0&&eng.gear!=='P'&&eng.gear!=='N')l+=eng.brake*55;
  document.getElementById('loadVal').textContent=Math.round(l)+'%';
  document.getElementById('tempVal').textContent=Math.round(eng.temp)+'°';
  document.getElementById('coolVal').textContent=Math.round(eng.coolEff)+'%';
  document.getElementById('pwrVal').textContent=eng.power;
  document.getElementById('boostVal').textContent=eng.boost.toFixed(1);
  const st=document.getElementById('status'),w=document.getElementById('warn');
  if(eng.stalled){st.textContent='ЗАГЛОХ';st.className='status danger';w.style.display='block';w.textContent='ДВИГАТЕЛЬ ЗАГЛОХ!';}
  else if(eng.temp>130||eng.wear>90){st.textContent='АВАРИЯ';st.className='status danger';w.style.display='block';w.textContent=eng.temp>130?'ПЕРЕГРЕВ!':'КРИТИЧЕСКИЙ ИЗНОС!';}
  else if(eng.temp>115||eng.rpm>eng.maxRpm*.9){st.textContent='НАГРУЗКА';st.className='status warn';w.style.display='none';}
  else{st.textContent='ГОТОВ';st.className='status ok';w.style.display='none';}
}
function sound(){updateSound();}

function animate(){
  const a=eng.angle;
  pistons.forEach((p,i)=>{
    const phase=a+i*(Math.PI*2/pistons.length);
    const s=Math.sin(phase)*.27;
    p.m.position.y=.42+s;
    if(rods[i]){rods[i].m.position.y=-.05+s*.48;rods[i].m.rotation.z=Math.sin(phase)*.16+(p.bank||0)*.08;}
  });
  if(crankG)crankG.rotation.x=a;
  injectors.forEach((inj,i)=>{const pulse=eng.throttle>.04?(Math.sin(a*5+i)*.5+.5):0;inj.scale.y=1+pulse*.18;});
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);animate();controls.update();renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);});
</script>
</body>
